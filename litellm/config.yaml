model_list:
  # OpenAI — decoded/encoded with real openai-go structs by the mock
  - model_name: openai/gpt-5
    litellm_params:
      model: openai/gpt-5
      api_base: http://mock-api:9000/v1
      api_key: sk-mock-anything

  - model_name: openai/gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_base: http://mock-api:9000/v1
      api_key: sk-mock-anything
      # api_base above is also what LiteLLM uses for /v1/responses calls, so no extra
      # model_list entry is needed to reach the mock's Responses API implementation.

  - model_name: openai/dall-e-3
    litellm_params:
      model: openai/dall-e-3
      api_base: http://mock-api:9000/v1
      api_key: sk-mock-anything
      mode: image_generation

  - model_name: openai/whisper-1
    litellm_params:
      model: openai/whisper-1
      api_base: http://mock-api:9000/v1
      api_key: sk-mock-anything
      mode: audio_transcription

  - model_name: openai/tts-1
    litellm_params:
      model: openai/tts-1
      api_base: http://mock-api:9000/v1
      api_key: sk-mock-anything
      mode: audio_speech

  - model_name: openai/sora-2
    litellm_params:
      model: openai/sora-2
      api_base: http://mock-api:9000/v1
      api_key: sk-mock-anything
      mode: video_generation

  # Bedrock — Claude, Nova, Llama 4, Mistral, and OpenAI's own gpt-oss hosted on Bedrock
  - model_name: bedrock/claude-sonnet-4-5
    litellm_params:
      model: bedrock/anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_bedrock_runtime_endpoint: http://mock-api:9000
      aws_region_name: us-east-1
      aws_access_key_id: mock
      aws_secret_access_key: mock

  - model_name: bedrock/gpt-oss-120b
    litellm_params:
      model: bedrock/openai.gpt-oss-120b-1:0
      aws_bedrock_runtime_endpoint: http://mock-api:9000
      aws_region_name: us-east-1
      aws_access_key_id: mock
      aws_secret_access_key: mock

  # Vertex / Gemini — genai structs directly from the mock. Auth uses a throwaway fake
  # service account (generated by scripts/gen-fake-vertex-credentials.py) whose token_uri
  # points at nginx's /oauth2/ route, which forwards to wiremock instead of the real
  # oauth2.googleapis.com — so this never needs real GCP credentials or network access.
  - model_name: vertex_ai/gemini-2.5-pro
    litellm_params:
      model: vertex_ai/gemini-2.5-pro
      # LiteLLM appends ":generateContent" straight onto api_base without inserting the model
      # segment itself, so api_base has to already end in the specific model's path.
      api_base: http://mock-api:9000/v1/projects/mock-project/locations/us-central1/publishers/google/models/gemini-2.5-pro
      vertex_project: mock-project
      vertex_location: us-central1
      vertex_credentials: /run/secrets/fake-vertex-credentials.json

litellm_settings:
  drop_params: true
  # Requires a `user` in the request body (or from the calling key's metadata) — LiteLLM's
  # OpenMeterLogger raises otherwise, since the event needs a subject.
  # "otel" exports one span per call via OTLP/gRPC to Jaeger (endpoint/exporter configured
  # through OTEL_EXPORTER/OTEL_ENDPOINT env vars on the litellm service).
  # "custom_callback.raw_response_logger" is our own callback (mounted alongside this file)
  # that forwards the full original_response to openmeter-mock -> MongoDB.
  callbacks: ["openmeter", "otel", "custom_callback.raw_response_logger"]

general_settings:
  master_key: sk-litellm-local-test
