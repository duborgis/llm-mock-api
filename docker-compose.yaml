services:
  mock-api:
    build: .
    container_name: llm-mock-api
    ports:
      - "9000:9000"
      - "9001:9001"

  # Fakes Google's oauth2.googleapis.com token endpoint, so LiteLLM's Vertex/service-account
  # auth flow can complete entirely offline against a throwaway, never-registered fake key.
  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: llm-mock-wiremock
    command: ["--port", "8080", "--global-response-templating"]
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings

  # Single front door: /llm -> litellm, /mock -> mock-api directly, /oauth2 -> wiremock.
  nginx:
    image: nginx:1.27-alpine
    container_name: llm-mock-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mock-api
      - wiremock
      - litellm

  litellm:
    # Pinned to a stable release rather than `main-latest` (which drifts and, at the time
    # this stack was built, had a version where the "openmeter" callback silently never
    # fired). v1.88.4 is confirmed working.
    image: ghcr.io/berriai/litellm:v1.88.4
    container_name: llm-mock-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
      - ./litellm/custom_callback.py:/app/custom_callback.py
      - ./litellm/secrets:/run/secrets:ro
    environment:
      OPENMETER_API_ENDPOINT: http://openmeter-mock:9010
      OPENMETER_API_KEY: mock-key
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - mock-api
      - openmeter-mock

  # Real MongoDB, storing every event the openmeter-mock ingests. Exposed on 9017 (within the
  # 9000-9099 block this machine's Windows-side nginx already TCP-proxies into WSL — see
  # /mnt/c/tools/nginx/conf/streams.conf), so any Mongo client on Windows (mongosh, Compass)
  # can connect straight to localhost:9017 with zero extra setup.
  mongo:
    image: mongo:7
    container_name: llm-mock-mongo
    ports:
      - "9017:27017"
    volumes:
      - mongo-data:/data/db

  # Imitates the one HTTP route LiteLLM's OpenMeter integration calls
  # (litellm/integrations/openmeter.py: POST {OPENMETER_API_ENDPOINT}/api/v1/events) and
  # persists every event into `mongo` above. Also on a port in the 9000-9099 block.
  openmeter-mock:
    build:
      context: .
      dockerfile: openmeter-mock.Dockerfile
    container_name: llm-mock-openmeter
    ports:
      - "9010:9010"
    depends_on:
      - mongo

volumes:
  mongo-data:
