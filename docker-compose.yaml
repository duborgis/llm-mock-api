services:
  mock-api:
    build: .
    container_name: llm-mock-api
    ports:
      - "9000:9000"
      - "9001:9001"

  # Fakes Google's oauth2.googleapis.com token endpoint, so LiteLLM's Vertex/service-account
  # auth flow can complete entirely offline against a throwaway, never-registered fake key.
  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: llm-mock-wiremock
    command: ["--port", "8080", "--global-response-templating"]
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings

  # Single front door: /llm -> litellm, /mock -> mock-api directly, /oauth2 -> wiremock.
  nginx:
    image: nginx:1.27-alpine
    container_name: llm-mock-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mock-api
      - wiremock
      - litellm

  litellm:
    # Pinned to a stable release rather than `main-latest` (which drifts and, at the time
    # this stack was built, had a version where the "openmeter" callback silently never
    # fired). v1.88.4 is confirmed working.
    image: ghcr.io/berriai/litellm:v1.88.4
    container_name: llm-mock-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
      - ./litellm/secrets:/run/secrets:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - mock-api
