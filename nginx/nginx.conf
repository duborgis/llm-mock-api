worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Single front door for the whole local stack:
    #   /llm/...    -> litellm (the proxy under test)
    #   /mock/...   -> the llm-mock-api itself (direct access, bypassing litellm)
    #   /oauth2/... -> wiremock, faking Google's oauth2.googleapis.com token endpoint
    #                  so litellm's Vertex/service-account auth flow never needs the
    #                  real internet — the fake service account JSON's "token_uri"
    #                  points here instead of https://oauth2.googleapis.com/token.
    #
    # Each proxy_pass below has a URI part (the trailing "/"), which makes nginx replace the
    # matched location prefix automatically: /oauth2/token -> /token, etc. This requires the
    # upstream hostname to already be DNS-resolvable when nginx starts; docker-compose's
    # `restart: unless-stopped` (see docker-compose.yaml) covers the case where nginx wins a
    # startup race against litellm/wiremock/mock-api by simply restarting until it doesn't.
    server {
        listen 8080;

        location /llm/ {
            proxy_pass http://litellm:4000/;
            proxy_set_header Host $host;
        }

        location /mock/ {
            proxy_pass http://mock-api:9000/;
            proxy_set_header Host $host;
        }

        location /oauth2/ {
            proxy_pass http://wiremock:8080/;
            proxy_set_header Host $host;
        }
    }
}
